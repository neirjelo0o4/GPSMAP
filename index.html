<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E-Bike Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <!-- Leaflet CSS para sa Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #121212; color: white; display: flex; flex-direction: column; height: 100vh; }
        .dashboard { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #1e1e1e; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .box { background: #2c2c2c; padding: 15px; border-radius: 8px; text-align: center; }
        .value { font-size: 2em; font-weight: bold; color: #4caf50; }
        .label { font-size: 0.8em; color: #aaa; text-transform: uppercase; }
        .mode { font-size: 1.2em; font-weight: bold; color: #ffeb3b; }
        #map { flex-grow: 1; width: 100%; }
        /* Battery Bar */
        .battery-container { grid-column: span 2; background: #2c2c2c; padding: 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; }
        .battery-outline { width: 100%; height: 20px; border: 2px solid #aaa; border-radius: 4px; padding: 2px; position: relative; }
        .battery-level { height: 100%; background: #4caf50; width: 100%; transition: width 0.3s; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="box">
            <div class="value" id="speed">0</div>
            <div class="label">Speed (KM/H)</div>
        </div>
        <div class="box">
            <div class="value" id="distance">0.00</div>
            <div class="label">Trip (KM)</div>
        </div>
        <div class="box" style="grid-column: span 2;">
            <div class="mode" id="speed-mode">IDLE</div>
            <div class="label">Current Mode</div>
        </div>
        <div class="battery-container">
            <span class="label">BAT</span>
            <div class="battery-outline">
                <div class="battery-level" id="battery-bar"></div>
            </div>
            <span id="battery-text">100%</span>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
