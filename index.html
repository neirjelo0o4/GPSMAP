<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E-Bike Navigation</title>
    <link rel="manifest" href="manifest.json">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f0f0f0; overflow: hidden; }
        
        /* Map is now FULL SCREEN */
        #map { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        /* Hide ugly routing default boxes */
        .leaflet-routing-container { display: none !important; }

        /* Floating Search Bar at the Top */
        .top-panel { position: absolute; top: 15px; left: 5%; width: 90%; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
        
        .nav-banner { background: #007aff; color: white; padding: 12px; text-align: center; font-weight: bold; border-radius: 12px; font-size: 0.9em; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: 0.3s; }
        
        .search-container { display: flex; background: white; padding: 8px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .search-container input { flex-grow: 1; padding: 10px; border: none; font-size: 1em; outline: none; border-radius: 10px; background: #f5f5f5; }
        .search-container button { margin-left: 8px; padding: 10px 15px; background: #007aff; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* Floating Dashboard at the Bottom (Grab/Google Style) */
        .bottom-panel { position: absolute; bottom: 20px; left: 5%; width: 90%; z-index: 1000; background: white; padding: 15px; border-radius: 20px; box-shadow: 0 -5px 25px rgba(0,0,0,0.15); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .box { background: #f8f9fa; padding: 12px; border-radius: 15px; text-align: center; position: relative; }
        
        .value { font-size: 1.8em; font-weight: 800; color: #1c1c1e; }
        .label { font-size: 0.65em; color: #8e8e93; text-transform: uppercase; font-weight: 700; margin-top: 4px; }
        
        /* Speed Mode Colors */
        .mode-idle { color: #8e8e93; }
        .mode-low { color: #34c759; }
        .mode-med { color: #ff9500; }
        .mode-high { color: #ff3b30; }

        /* Battery Section */
        .battery-section { grid-column: span 2; display: flex; flex-direction: column; gap: 8px; margin-top: 5px; }
        .battery-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.85em; font-weight: 700; color: #1c1c1e; }
        
        input[type="number"] { width: 50px; border: 1px solid #d1d1d6; border-radius: 6px; padding: 4px; text-align: center; font-weight: bold; margin-left: 5px; }
        
        .battery-bar-container { background: #e5e5ea; height: 12px; width: 100%; border-radius: 6px; overflow: hidden; }
        .battery-bar-fill { background: #34c759; height: 100%; width: 100%; transition: width 0.5s ease; }
        
        .btn-reset { position: absolute; top: 8px; right: 8px; background: none; border: 1px solid #ff3b30; color: #ff3b30; padding: 3px 6px; border-radius: 6px; font-size: 0.6em; font-weight: bold; cursor: pointer; }
        
        /* Smooth Icon Rotation */
        .vehicle-icon { transition: transform 0.3s linear; width: 45px; height: 45px; }
    </style>
</head>
<body>

    <!-- FULLSCREEN MAP -->
    <div id="map"></div>

    <!-- FLOATING TOP PANEL -->
    <div class="top-panel">
        <div class="nav-banner" id="nav-banner" style="display: none;"></div>
        <div class="search-container">
            <input type="text" id="dest-input" placeholder="Search destination...">
            <button onclick="searchDestination()">Route</button>
        </div>
    </div>

    <!-- FLOATING BOTTOM DASHBOARD -->
    <div class="bottom-panel">
        <div class="box">
            <div class="value" id="speed">0</div>
            <div class="label">Speed (KM/H)</div>
        </div>
        
        <div class="box">
            <button class="btn-reset" onclick="resetTrip()">RESET</button>
            <div class="value" id="distance">0.00</div>
            <div class="label">Trip (KM)</div>
        </div>
        
        <div class="box">
            <div class="value mode-idle" id="speed-mode" style="font-size: 1.2em;">IDLE</div>
            <div class="label">Drive Mode</div>
        </div>
        
        <div class="box">
            <div class="value" id="dest-dist" style="color: #007aff;">0.00</div>
            <div class="label">To Dest (KM)</div>
        </div>
        
        <div class="battery-section">
            <div class="battery-header">
                <span>BATTERY: <input type="number" id="battery-input" value="100" max="100" min="0" oninput="updateRange()"> %</span>
                <span style="color: #007aff;">RANGE: <span id="est-range">30.0</span> KM</span>
            </div>
            <div class="battery-bar-container">
                <div id="battery-bar-fill" class="battery-bar-fill"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script src="app.js"></script>
</body>
</html>
