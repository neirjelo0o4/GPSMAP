<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern E-Bike Navigation</title>
    <link rel="manifest" href="manifest.json">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Modern Glass Banner */
        .nav-banner { background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(10px); color: #fff; padding: 15px; text-align: center; font-weight: bold; font-size: 1.1em; z-index: 1000; border-bottom: 1px solid #333; transition: all 0.3s ease; }
        
        /* Glass Dashboard */
        .dashboard { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: rgba(20, 20, 20, 0.9); z-index: 10; border-bottom: 1px solid #333; backdrop-filter: blur(10px); }
        .box { background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 12px; text-align: center; position: relative; border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* Glowing Values */
        .value { font-size: 2em; font-weight: bold; color: #00e5ff; text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); }
        .label { font-size: 0.7em; color: #888; text-transform: uppercase; margin-top: 5px; letter-spacing: 1px; }
        .mode { font-size: 1.3em; font-weight: bold; color: #ffea00; margin-top: 5px;}
        
        /* Red Reset Button */
        .btn-reset { position: absolute; top: 10px; right: 10px; background: rgba(255, 50, 50, 0.2); color: #ff4c4c; border: 1px solid #ff4c4c; padding: 4px 8px; border-radius: 6px; font-size: 0.6em; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-reset:hover { background: #ff4c4c; color: #fff; }
        
        /* Battery Input & Bar */
        input[type="number"] { width: 60px; font-size: 1em; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #00e5ff; text-align: center; border-radius: 6px; padding: 5px; font-weight: bold; outline: none; }
        .battery-bar-container { background: #222; height: 10px; width: 100%; border-radius: 5px; overflow: hidden; margin-top: 12px; }
        .battery-bar-fill { background: #00e5ff; height: 100%; width: 100%; transition: width 0.5s ease; box-shadow: 0 0 10px #00e5ff; }

        /* Modern Search Box */
        .search-container { display: flex; padding: 15px; background: rgba(20, 20, 20, 0.9); gap: 10px; z-index: 10; border-top: 1px solid #333; backdrop-filter: blur(10px); }
        .search-container input { flex-grow: 1; padding: 12px; border-radius: 8px; border: 1px solid #444; font-size: 1em; background: #111; color: white; outline: none; }
        .search-container button { padding: 12px 20px; background: #00e5ff; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .search-container button:hover { background: #00b8cc; }
        
        #map { flex-grow: 1; width: 100%; background: #000; }
        .leaflet-routing-container { display: none !important; }
        
        /* Smooth Icon Rotation for the Vehicle */
        .vehicle-icon { transition: transform 0.3s linear; width: 45px; height: 45px; display: block; }
    </style>
</head>
<body>

    <div class="nav-banner" id="nav-banner">
        Search or tap a destination to start
    </div>

    <div class="dashboard">
        <div class="box">
            <div class="value" id="speed">0</div>
            <div class="label">Speed (KM/H)</div>
        </div>
        
        <div class="box">
            <button class="btn-reset" onclick="resetTrip()">RESET</button>
            <div class="value" id="distance">0.00</div>
            <div class="label">Trip (KM)</div>
        </div>
        
        <div class="box">
            <div class="mode" id="speed-mode">IDLE</div>
            <div class="label">Drive Mode</div>
        </div>
        
        <div class="box">
            <div class="value" id="dest-dist" style="color: #ffea00;">0.00</div>
            <div class="label">To Dest (KM)</div>
        </div>
        
        <div class="box" style="grid-column: span 2;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 0.9em; font-weight: bold; color: #aaa;">BAT: <input type="number" id="battery-input" value="100" max="100" min="0" oninput="updateRange()"> %</span>
                <span style="color: #00e5ff; font-weight: bold; font-size: 1.1em;">RANGE: <span id="est-range">30.0</span> KM</span>
            </div>
            <div class="battery-bar-container">
                <div id="battery-bar-fill" class="battery-bar-fill"></div>
            </div>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="dest-input" placeholder="Where do you want to go?">
        <button onclick="searchDestination()">Route</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script src="app.js"></script>
</body>
</html>
